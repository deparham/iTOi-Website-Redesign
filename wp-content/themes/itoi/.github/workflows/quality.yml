name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  theme-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build

      - name: Check compiled CSS is up to date
        run: git diff --exit-code -- assets/css/style.css

      - name: Build JS
        run: npm run build:js

      - name: Check minified JS is up to date
        run: git diff --exit-code -- assets/js/*.min.js

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Run PHP_CodeSniffer
        run: vendor/bin/phpcs

      - name: PHP lint (syntax only, every tracked .php file)
        run: |
          git ls-files '*.php' | xargs -n1 -P4 php -l

  # Accessibility checks need a reachable staging URL, supplied via the
  # A11Y_BASE_URL repository secret (Settings > Secrets and variables >
  # Actions). That secret must be set for this job to succeed — if it's
  # missing, scripts/a11y-check.js will fail to reach a real site and the
  # job fails rather than silently skipping, which is deliberate: it forces
  # the secret to be configured before accessibility checks can pass,
  # rather than quietly never running at all.
  accessibility:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run axe-core against staging (scripts/a11y-check.js)
        env:
          A11Y_BASE_URL: ${{ secrets.A11Y_BASE_URL }}
        run: npm run test:a11y
