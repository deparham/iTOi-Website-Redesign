name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  theme-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build

      - name: Check compiled CSS is up to date
        run: git diff --exit-code -- assets/css/style.css

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Run PHP_CodeSniffer
        run: vendor/bin/phpcs

      - name: PHP lint (syntax only, every tracked .php file)
        run: |
          git ls-files '*.php' | xargs -n1 -P4 php -l

  # Accessibility/visual/Lighthouse checks need a reachable staging URL —
  # not runnable against a real environment from this workflow alone, so
  # they're a separate, manually-triggered job rather than blocking every
  # PR on infrastructure this repo doesn't control. See docs/deployment.md
  # once that documents the staging URL this should point at.
  accessibility:
    runs-on: ubuntu-latest
    if: false # flip on once A11Y_BASE_URL / a real staging URL exists as a repo/environment secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run axe-core against staging (scripts/a11y-check.js)
        env:
          A11Y_BASE_URL: ${{ secrets.A11Y_BASE_URL }}
        run: npm run test:a11y
